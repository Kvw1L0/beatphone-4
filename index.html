<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#081a4b" />
    <title>Beatphone 4</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="game-card" aria-live="polite">
        <div class="brand">BEATPHONE <span>4</span></div>
        <p id="status" class="status">Prepara al equipo</p>
        <div class="beat-display"><strong id="beats">0</strong><span>/ 4800 MOVIMIENTOS</span></div>
        <div class="progress-track" aria-label="Progreso total"><div id="total-progress" class="progress-fill"></div></div>
        <div class="turn-card">
          <span>PERSONA</span><strong id="player-number">1 / 16</strong>
          <p><b id="turn-beats">0</b> / 300 movimientos</p>
          <div class="progress-track small"><div id="turn-progress" class="progress-fill"></div></div>
        </div>
        <button id="start-button" class="primary">COMENZAR</button>
        <p id="hint" class="hint">Sacude el teléfono o toca la pantalla para sumar.</p>
      </section>
    </main>

    <div id="overlay" class="overlay" hidden>
      <section class="modal">
        <p class="eyebrow">RELEVO</p>
        <h1 id="modal-title">¡CAMBIO DE PERSONA!</h1>
        <p id="modal-copy">Ya completaste 300 movimientos.</p>
        <p id="modal-detail" class="modal-detail">Pásale el teléfono a la persona 2.</p>
        <button id="continue-button" class="primary">CONTINUAR</button>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
